<!doctype html>
<!-- Code-drawn scenes. Deterministic: window.draw(scene, t) paints exactly one frame for time t (seconds), so the
     same scene renders identically every time and every label is sharp. render_motion.mjs steps t at the reel's fps.
     Nothing here comes from a model. Scene words come from reel.json → "scenes"; colors from "palette".
     Add your own scene: write a function name(t) that paints the whole frame, then add it to SCENES at the bottom. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<style id="fonts"></style></head>
<body><canvas id="c"></canvas>
<script>
const cv = document.getElementById("c"), g = cv.getContext("2d");
let R, P, W, H, B, FAM, DUR, S, LOGO = null;

// Scenes are designed in a 1080-wide portrait space with their content inside y 100..1300, then fitted onto the
// real canvas: centered in the top part on a vertical video (the titles live below), on the right half of a
// widescreen one (the titles live on the left).
function fit(center) {
  const land = W > H && !center;  // the end card is centered on every shape
  S = land ? Math.min(0.52 * W / 1080, 0.92 * H / 1200) : Math.min(W / 1080, 0.64 * H / 1200);
  if (W > H && center) S = 0.92 * H / 1200;
  const cx = land ? W * 0.72 : W / 2, cy = W > H ? H / 2 : H * 0.35;
  g.setTransform(S, 0, 0, S, cx - 540 * S, cy - 700 * S);
}
window.setup = (reel, dur, logo) => {
  R = reel; P = reel.palette; [W, H] = reel.size; B = reel.music?.beat || 0.6; FAM = reel.font?.family || "system-ui";
  DUR = dur; cv.width = W; cv.height = H;
  if (logo) { LOGO = new Image(); LOGO.src = logo; return new Promise((ok) => (LOGO.onload = ok)); }
};
const F = (w, s) => `${w} ${s}px "${FAM}", system-ui, sans-serif`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outq = (x) => 1 - Math.pow(1 - clamp(x), 3);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
function rrect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function wrap(text, maxW) {
  const words = text.split(" "), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
// Ground first, in canvas space: it must be the exact color of the site footage and the title cards, or the
// blacks won't match when the pieces are joined.
function ground(dots, center) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = P.ground; g.fillRect(0, 0, W, H);
  if (dots) { g.fillStyle = rgba(P.ink, 0.045); for (let y = 30; y < H; y += 60) for (let x = 30; x < W; x += 60) g.fillRect(x, y, 3, 3); }
  fit(center);
}

// ───────── chat: a session that forgets. Questions typed, non-answers given, wiped, faster each time. ─────────
function chat(t) {
  ground(false);
  const c = R.scenes?.chat || {};
  const cycles = c.cycles || [{ q: "Where did we leave off?", a: "I don't have any memory of past conversations." }];
  const weights = cycles.map((_, i) => Math.pow(0.86, i)), sum = weights.reduce((a, b) => a + b, 0);
  const live = DUR * 0.86;  // the last stretch is the empty box and a blinking cursor
  const x = 90, y = 250, w = 900, h = 840;
  let t0 = 0, cyc = null, lt = 0;
  for (let i = 0; i < cycles.length; i++) { const L = live * weights[i] / sum; if (t < t0 + L) { cyc = cycles[i]; lt = (t - t0) / L; break; } t0 += L; }
  g.fillStyle = P.card; rrect(x, y, w, h, 40); g.fill(); g.strokeStyle = P.line; g.lineWidth = 3; g.stroke();
  const flash = cyc ? clamp(1 - lt / 0.12) : 0;
  g.font = F(600, 34); g.textBaseline = "middle"; g.textAlign = "left";
  g.fillStyle = flash > 0 ? rgba(P.accent, 0.4 + 0.6 * flash) : P.dim;
  g.fillText(c.header || "New session", x + 48, y + 64);
  g.strokeStyle = P.line; g.beginPath(); g.moveTo(x, y + 120); g.lineTo(x + w, y + 120); g.stroke();
  rrect(x + 36, y + h - 130, w - 72, 92, 46); g.stroke();
  if (!cyc) {
    if (Math.floor(t * 4) % 2 === 0) { g.fillStyle = P.ink; g.fillRect(x + 84, y + h - 106, 4, 44); }
    g.font = F(500, 32); g.fillStyle = rgba(P.ink, 0.3); g.fillText(c.placeholder || "Ask anything", x + 100, y + h - 84);
    return;
  }
  g.save(); g.globalAlpha = clamp(lt > 0.9 ? 1 - (lt - 0.9) / 0.1 : 1);
  g.font = F(600, 44);
  const typed = cyc.q.slice(0, Math.round(cyc.q.length * clamp(lt / 0.32)));
  if (typed) {
    const bw = Math.min(g.measureText(cyc.q).width + 72, w - 160), bx = x + w - 48 - bw, by = y + 180;
    g.fillStyle = P.ink; rrect(bx, by, bw, 96, 48); g.fill(); g.fillStyle = P.ground; g.fillText(typed, bx + 36, by + 50);
  }
  const words = cyc.a.split(" "), shown = Math.round(words.length * clamp((lt - 0.4) / 0.38));
  if (shown > 0) { g.font = F(500, 44); g.fillStyle = rgba(P.ink, 0.82); wrap(words.slice(0, shown).join(" "), w - 200).forEach((ln, i) => g.fillText(ln, x + 60, y + 360 + i * 62)); }
  g.restore();
  if (lt > 0.88) { const p = clamp((lt - 0.88) / 0.12); g.fillStyle = P.accent; g.fillRect(x + 2, y + 120 + p * (h - 250), w - 4, 4); }
}

// ───────── hub: the thing in the middle, its layers drawn as rings, then everything it connects to. ─────────
// Ring labels stay SHORT and sit ON their own ring. A label wider than its ring notches the ring and makes a
// perfect circle read tall. Put the long descriptions in the titles under the diagram instead.
function hub(t) {
  ground(true);
  const c = R.scenes?.hub || {}, C = { x: 540, y: 640 };
  const rings = (c.rings || ["LAYER 1", "LAYER 2", "LAYER 3"]).map((label, k) => ({ label, r: 132 + 64 * k, t: 2 * B * k }));
  const nodes = c.nodes || ["Files", "Notes", "Servers", "Models", "Data", "Tools"];
  const NT = 2 * B * rings.length, NR = 392;
  const node = (i) => { const a = (-90 + 22.5 + i * 360 / nodes.length) * Math.PI / 180; return { x: C.x + NR * Math.cos(a), y: C.y + NR * Math.sin(a), a }; };
  const zoom = 1 + 0.05 * ease(t / DUR);
  g.translate(C.x, C.y); g.scale(zoom, zoom); g.translate(-C.x, -C.y);
  const outer = rings.length ? rings[rings.length - 1].r + 2 : 80;
  nodes.forEach((_, i) => {
    const st = NT + i * (B / 2), p = outq((t - st) / 0.28); if (p <= 0) return;
    const n = node(i), sx = C.x + outer * Math.cos(n.a), sy = C.y + outer * Math.sin(n.a);
    g.strokeStyle = rgba(P.ink, 0.32); g.lineWidth = 3; g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + (n.x - sx) * p, sy + (n.y - sy) * p); g.stroke();
    if (t > NT + nodes.length * (B / 2)) for (let k = 0; k < 2; k++) {  // traffic, once everything is connected
      const ph = (t * 1.25 + i * 0.37 + k * 0.5) % 1, q = (i + k) % 2 ? 1 - ph : ph;
      g.fillStyle = P.accent; g.beginPath(); g.arc(sx + (n.x - sx) * q, sy + (n.y - sy) * q, 7, 0, 7); g.fill();
    }
  });
  rings.forEach((r) => {
    const p = ease((t - r.t) / 0.55); if (p <= 0) return;
    const on = t < r.t + 2 * B;
    g.strokeStyle = on ? P.ink : rgba(P.ink, 0.4); g.lineWidth = on ? 4 : 3;
    g.beginPath(); g.arc(C.x, C.y, r.r, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); g.stroke();
  });
  const cp = outq(t / 0.3), beat = (t % B) / B;
  g.strokeStyle = rgba(P.accent, 0.55 * (1 - beat)); g.lineWidth = 3; g.beginPath(); g.arc(C.x, C.y, 70 + 40 * beat, 0, 7); g.stroke();
  g.fillStyle = P.card; g.beginPath(); g.arc(C.x, C.y, 70 * cp, 0, 7); g.fill(); g.strokeStyle = P.accent; g.lineWidth = 4; g.stroke();
  g.font = F(800, 28); g.fillStyle = P.ink; g.textAlign = "center"; g.textBaseline = "middle";
  g.globalAlpha = cp; g.fillText(c.center || "AGENT", C.x, C.y + 1); g.globalAlpha = 1;
  nodes.forEach((label, i) => {
    const st = NT + i * (B / 2) + 0.2, p = outq((t - st) / 0.22); if (p <= 0) return;
    const n = node(i); g.font = F(700, 30);
    const bw = g.measureText(label).width + 48, bh = 66;
    g.globalAlpha = p; g.fillStyle = P.card; rrect(n.x - bw / 2, n.y - bh / 2, bw, bh, 14); g.fill();
    g.strokeStyle = t - st < 0.35 ? P.accent : rgba(P.ink, 0.5); g.lineWidth = 3; g.stroke();
    g.fillStyle = P.ink; g.fillText(label, n.x, n.y + 1); g.globalAlpha = 1;
  });
  g.font = F(700, 24);
  rings.forEach((r) => {
    const p = clamp((t - r.t - 0.15) / 0.3); if (p <= 0) return;
    const on = t < r.t + 2 * B && t < NT, tw = g.measureText(r.label).width + 24, yy = C.y - r.r;
    g.globalAlpha = p; g.fillStyle = P.ground; g.fillRect(C.x - tw / 2, yy - 16, tw, 32);
    g.fillStyle = on ? P.ink : P.dim; g.fillText(r.label, C.x, yy); g.globalAlpha = 1;
  });
}

// ───────── sources: a claim whose footnote markers fire links down to the cards that back it. ─────────
function glyph(k, x, y, s, col) {
  g.strokeStyle = col; g.lineWidth = 3; g.beginPath();
  if (k === "PAPER") { g.rect(x - s * .35, y - s * .45, s * .7, s * .9); for (let i = 0; i < 3; i++) { g.moveTo(x - s * .2, y - s * .2 + i * s * .2); g.lineTo(x + s * .2, y - s * .2 + i * s * .2); } }
  else if (k === "CODE") { g.moveTo(x - s * .15, y - s * .3); g.lineTo(x - s * .4, y); g.lineTo(x - s * .15, y + s * .3); g.moveTo(x + s * .15, y - s * .3); g.lineTo(x + s * .4, y); g.lineTo(x + s * .15, y + s * .3); }
  else if (k === "FILING") { g.rect(x - s * .4, y - s * .3, s * .8, s * .6); g.moveTo(x - s * .4, y - s * .3); g.lineTo(x, y + s * .05); g.lineTo(x + s * .4, y - s * .3); }
  else if (k === "DATA" || k === "DATASET") { for (let i = 0; i < 3; i++) { g.moveTo(x - s * .38, y - s * .3 + i * s * .3); g.lineTo(x + s * .38, y - s * .3 + i * s * .3); } g.moveTo(x - s * .1, y - s * .42); g.lineTo(x - s * .1, y + s * .42); }
  else if (k === "VIDEO" || k === "TRANSCRIPT") { g.rect(x - s * .4, y - s * .28, s * .8, s * .56); g.moveTo(x - s * .1, y - s * .14); g.lineTo(x + s * .16, y); g.lineTo(x - s * .1, y + s * .14); g.closePath(); }
  else { g.arc(x - s * .2, y - s * .2, s * .1, 0, 7); g.moveTo(x - s * .1, y - s * .2); g.lineTo(x + s * .35, y - s * .2); g.moveTo(x - s * .2, y - s * .1); g.lineTo(x - s * .2, y + s * .3); g.lineTo(x + s * .35, y + s * .3); }
  g.stroke();
}
function sources(t) {
  ground(true);
  const c = R.scenes?.sources || {};
  const cards = (c.cards || [{ k: "PAPER", t: "Papers" }, { k: "CODE", t: "Code" }, { k: "DATA", t: "Raw data" }]).slice(0, 6);
  const zoom = 1 + 0.04 * ease(t / DUR);
  g.translate(540, 600); g.scale(zoom, zoom); g.translate(-540, -600);
  const fx = 110, fy = 150, fw = 860, fh = 250;
  g.fillStyle = P.card; rrect(fx, fy, fw, fh, 24); g.fill(); g.strokeStyle = P.line; g.lineWidth = 3; g.stroke();
  g.font = F(700, 24); g.fillStyle = P.dim; g.textBaseline = "middle"; g.textAlign = "left"; g.fillText(c.heading || "CLAIM", fx + 40, fy + 44);
  [[700, 100], [620, 150], [460, 200]].forEach(([w, dy]) => { g.fillStyle = rgba(P.ink, 0.18); rrect(fx + 40, fy + dy - 10, w, 20, 10); g.fill(); });
  const slots = [[752, 100], [672, 150], [512, 200], [790, 100], [712, 150], [552, 200]].map(([dx, dy]) => [fx + dx, fy + dy]);
  const cw = 280, ch = 200, gx = 30, gy = 36, x0 = (1080 - 3 * cw - 2 * gx) / 2, y0 = 620, allIn = 0.12 + cards.length * (B / 2);
  cards.forEach((sc, i) => {
    const st = 0.12 + i * (B / 2), p = outq((t - st) / 0.2); if (p <= 0) return;
    const cx = x0 + (i % 3) * (cw + gx), cy = y0 + Math.floor(i / 3) * (ch + gy), [mx, my] = slots[i];
    const lp = outq((t - st) / 0.16), tx = cx + cw / 2, ty = cy, c1y = my + 180;
    g.strokeStyle = P.accent; g.lineWidth = 3; g.beginPath(); g.moveTo(mx, my + 14);
    g.bezierCurveTo(mx, c1y, tx, ty - 160, mx + (tx - mx) * lp, my + 14 + (ty - my - 14) * lp); g.stroke();
    if (t > allIn) for (let k = 0; k < 2; k++) {  // evidence keeps flowing up into the claim
      const u = 1 - ((t - allIn) * 0.9 + i * 0.17 + k * 0.5) % 1, v = 1 - u;
      const px = v*v*v*mx + 3*v*v*u*mx + 3*v*u*u*tx + u*u*u*tx, py = v*v*v*(my+14) + 3*v*v*u*c1y + 3*v*u*u*(ty-160) + u*u*u*ty;
      g.fillStyle = P.accent; g.beginPath(); g.arc(px, py, 7, 0, 7); g.fill();
    }
    const yy = cy + (1 - p) * 30;
    g.globalAlpha = p; g.fillStyle = P.card; rrect(cx, yy, cw, ch, 20); g.fill();
    g.strokeStyle = t - st < 0.4 ? P.accent : rgba(P.ink, 0.4); g.lineWidth = 3; g.stroke();
    glyph(sc.k, cx + 64, yy + 70, 70, P.ink);
    g.font = F(700, 22); g.fillStyle = P.dim; g.textAlign = "left"; g.fillText(sc.k, cx + 30, yy + 140);
    g.font = F(700, 34); g.fillStyle = P.ink; g.fillText(sc.t, cx + 30, yy + 172); g.globalAlpha = 1;
  });
  cards.forEach((_, i) => {
    const [mx, my] = slots[i], on = t > 0.12 + i * (B / 2);
    g.fillStyle = on ? P.accent : rgba(P.ink, 0.25); g.beginPath(); g.arc(mx, my, 13, 0, 7); g.fill();
    g.font = F(800, 17); g.fillStyle = P.ink; g.textAlign = "center"; g.fillText(String(i + 1), mx, my + 1);
  });
}

// ───────── endcard: the logo in its own tile, ABOVE the name, then the address. ─────────
// Beside the words, a simple mark reads as a letter ("L The Lab?"). In a rounded app-icon tile, above the name,
// it reads as a logo. The name arrives only after the mark has landed.
function endcard(t) {
  ground(false, true);
  const c = R.scenes?.endcard || {};
  let wy = 1000;
  if (LOGO) {
    const T = 300, tx = 540 - T / 2, ty = 520, tp = outq(t / 0.3), sc = 0.9 + 0.1 * tp;
    g.save(); g.translate(540, ty + T / 2); g.scale(sc, sc); g.translate(-540, -(ty + T / 2)); g.globalAlpha = tp;
    g.shadowColor = rgba(P.accent, 0.18); g.shadowBlur = 60; g.fillStyle = P.card; rrect(tx, ty, T, T, 66); g.fill();
    g.shadowBlur = 0; g.strokeStyle = P.line; g.lineWidth = 3; g.stroke();
    const m = T * 0.64, ar = LOGO.width / LOGO.height, lw = ar >= 1 ? m : m * ar, lh = ar >= 1 ? m / ar : m;
    g.drawImage(LOGO, 540 - lw / 2, ty + (T - lh) / 2, lw, lh);
    g.restore(); g.globalAlpha = 1; wy = 1000;
  }
  const wp = outq((t - (LOGO ? 0.7 : 0.1)) / 0.3), up = outq((t - (LOGO ? 0.95 : 0.35)) / 0.3);
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.globalAlpha = wp; g.font = F(800, 120); g.fillStyle = P.ink; g.fillText(c.wordmark || "NAME", 540, wy + (1 - wp) * 20);
  g.globalAlpha = up; g.font = F(500, 46); g.fillStyle = P.dim; g.fillText(c.url || "", 540, wy + 86 + (1 - up) * 14);
  g.globalAlpha = 1;
}

const SCENES = { chat, hub, sources, endcard };
window.scenes = Object.keys(SCENES);
window.draw = (scene, t) => { g.textAlign = "left"; SCENES[scene](t); g.setTransform(1, 0, 0, 1, 0, 0); };
window.frame = () => cv.toDataURL("image/jpeg", 0.95);
</script></body></html>
